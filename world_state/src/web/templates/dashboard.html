<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>WorldState 栖息地仿真控制台</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", monospace, system-ui;
        }
        body {
            background: #0c1016;
            color: #e6edf7;
            padding: 24px;
        }
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        h1 {
            color: #5cf0ff;
            border-bottom: 1px solid #2a4858;
            padding-bottom: 12px;
            text-shadow: 0 0 8px #24b8c9;
            margin-bottom:16px;
        }
        .meta-bar {
            display: flex;
            gap:24px;
            align-items:center;
            background: #141b26;
            border:1px solid #284252;
            border-radius: 8px;
            padding:14px 20px;
            margin-bottom:20px;
            flex-wrap: wrap;
        }
        .meta-bar span {
            font-size: 15px;
        }
        .meta-bar span strong{
            color:#7cf2ff;
        }
        button {
            background: #1b5f6b;
            color:#e6fdff;
            border:1px solid #3498a8;
            border-radius: 4px;
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:hover{
            background:#278292;
            box-shadow: 0 0 10px #28b7cc70;
        }
        select{
            background:#080c11;
            color:#7cf2ff;
            border:1px solid #2a4858;
            padding:7px;
            border-radius:4px;
        }
        .grid {
            display:grid;
            grid-template-columns: 1fr 1fr;
            gap:18px;
        }
        .card {
            background:#141b26;
            border: 1px solid #284252;
            border-radius: 10px;
            padding:18px;
            box-shadow: 0 0 12px #0f343b40;
        }
        .card h3{
            color:#6ee7f5;
            margin-bottom:12px;
            border-bottom:1px solid #243a47;
            padding-bottom:8px;
        }
        pre {
            background:#080c11;
            color:#76ff9c;
            padding:12px;
            border-radius:6px;
            min-height:160px;
            overflow-x:auto;
            font-size:13px;
            border:1px solid #1f3542;
        }
        .form-area{
            margin-top:14px;
            padding-top:14px;
            border-top:1px solid #243a47;
        }
        .form-area h4{
            color:#b1dce2;
            margin-bottom:8px;
        }
        textarea{
            width:100%;
            background:#080c11;
            color:#e8f9fc;
            border:1px solid #2a4858;
            border-radius:6px;
            padding:10px;
            font-family:monospace;
            font-size:13px;
        }
        .monitor-box {
            box-sizing: border-box; /* 新增这一行，全局生效，日志盒子受益 */
            background: #0c141c;
            color: #7cf0bd;
            font-family: "Consolas", "Monaco", monospace;
            font-size:13px;
            padding:10px;
            border:1px solid #28475b;
            border-radius:4px;
            height:180px;
            overflow-y: auto;
            white-space: pre;
            box-shadow: 0 0 6px #173242 inset;
        }
        .monitor-box::-webkit-scrollbar {
            width: 6px;
        }
        .monitor-box::-webkit-scrollbar-thumb {
            background:#3b647c;
            border-radius:3px;
        }

    </style>
</head>
<body>
<div class="container">
    <h1>🛰️ 密闭栖息地 WorldState 仿真控制台</h1>
    <div class="meta-bar">
        <span>全局版本：<strong id="global-version">0</strong></span>
        <span>最后更新：<strong id="last-modified">-</strong></span>
        <button onclick="refreshAllState()">🔄 刷新全部状态</button>

        <div>
            <label>快照回滚：</label>
            <select id="snapshot-select">
                <option value="">加载版本列表...</option>
            </select>
            <button onclick="rollbackSnapshot()">⏮ 回滚到此版本</button>
        </div>
    </div>

    <div class="grid">
        <!-- 环境卡片 -->
        <div class="card">
            <h3>🌡 Environment 舱内环境</h3>
            <pre id="env-display">等待加载...</pre>
            <div class="form-area">
                <h4>发送事件 Patch</h4>
                <textarea id="env-patch" rows="6">{
"temperature":25,
"humidity":50
}</textarea>
                <button onclick="sendEvent('environment.state.patch', JSON.parse(document.getElementById('env-patch').value))">提交更新</button>
            </div>
        </div>

        <!-- 乘员卡片 -->
        <div class="card">
            <h3>👨‍🚀 Crew 乘员状态</h3>
            <pre id="crew-display">等待加载...</pre>
            <div class="form-area">
                <h4>发送事件 Patch</h4>
                <textarea id="crew-patch" rows="6">{
"total_count":1,
"members":[{"member_id":"c001","name":"Alice","health":95,"fatigue":20,"emotion":80}]
}</textarea>
                <button onclick="sendEvent('crew.state.patch', JSON.parse(document.getElementById('crew-patch').value))">提交更新</button>
            </div>
        </div>

        <!-- 告警卡片 -->
        <div class="card">
            <h3>⚠ Alert 告警列表</h3>
            <pre id="alert-display">等待加载...</pre>
            <div class="form-area">
                <h4>发送事件 Patch</h4>
                <textarea id="alert-patch" rows="6">{
"alerts":[{"alert_id":"a001","title":"温度偏高","level":"warning","source":"temp_sensor_1","is_resolved":false}]
}</textarea>
                <button onclick="sendEvent('alert.state.patch', JSON.parse(document.getElementById('alert-patch').value))">提交更新</button>
            </div>
        </div>

        <!-- 设备卡片 -->
        <div class="card">
            <h3>⚙ Equipment 舱载设备</h3>
            <pre id="equip-display">等待加载...</pre>
            <div class="form-area">
                <h4>发送事件 Patch</h4>
                <textarea id="equip-patch" rows="6">{
"devices":[{"equip_id":"eq001","name":"主供氧机组","category":"life_support","status":"normal","power":85}]
}</textarea>
                <button onclick="sendEvent('equipment.state.patch', JSON.parse(document.getElementById('equip-patch').value))">提交更新</button>
            </div>
        </div>

        <!-- 事件日志 -->
        <div class="card">
            <h3>事件日志</h3>
            <button onclick="clearEventLog()">清空日志</button>
            <div class="monitor-box" id="event-log" style="width:100%;box-sizing:border-box;white-space:pre-wrap;"></div>
        </div>

    </div>
</div>

<script>
const API_BASE = "";
let activeSnapshotVersion = "";
// 事件日志缓存，上限20条，可以按需改
const MAX_LOG_COUNT = 20;
let eventLogList = [];

// 新增：添加日志条目
function appendEventLog(eventObj) {
    const now = new Date().toISOString().split('.')[0].replace('T',' ');
    const logItem = {
        time: now,
        type: eventObj.event_type,
        source: eventObj.source,
        payload: eventObj.payload
    };
    // 新日志放数组头部
    eventLogList.unshift(logItem);
    // 超出上限，砍掉旧日志
    if(eventLogList.length > MAX_LOG_COUNT){
        eventLogList.pop();
    }
    renderEventLog();
}

// 渲染日志到面板
function renderEventLog(){
    const logDom = document.getElementById("event-log");
    let text = "";
    eventLogList.forEach(item=>{
        text += `[${item.time}] | ${item.type} | source:${item.source}\n`;
        text += `payload: ${JSON.stringify(item.payload)}\n`;
        text += "----------------------------------------\n";
    })
    logDom.innerText = text;
}

// 一键清空日志
function clearEventLog(){
    eventLogList = [];
    renderEventLog();
}

async function refreshAllState() {
    const res = await fetch(`${API_BASE}/state/latest`);
    const data = await res.json();
    document.getElementById("global-version").innerText = data.version;
    document.getElementById("last-modified").innerText = formatTs(data.last_modified) || "-";
    document.getElementById("env-display").innerText = JSON.stringify(data.environment, null, 2);
    document.getElementById("crew-display").innerText = JSON.stringify(data.crew, null, 2);
    document.getElementById("alert-display").innerText = JSON.stringify(data.alert, null, 2);
    document.getElementById("equip-display").innerText = JSON.stringify(data.equipment, null, 2);
    await loadSnapshotList();
}

function formatTs(isoStr) {
    return isoStr.split('.')[0];
}

async function loadSnapshotList(){
    const sel = document.getElementById("snapshot-select");
    sel.innerHTML = "";
    try{
        const resp = await fetch(`${API_BASE}/snapshots/list`);
        if (!resp.ok) {
            throw new Error(`http错误:${resp.status}`);
        }
        const list = await resp.json();
        console.log("快照列表原始数据：", list);

        if(list.length ===0){
            sel.innerHTML = `<option value="">暂无可回滚快照</option>`;
            return;
        }
        list.forEach(v=>{
            const opt = document.createElement('option');
            opt.value = v.version;
            opt.innerText = `${v.version}|${formatTs(v.ts)}`;
            sel.appendChild(opt);
        })
        if(activeSnapshotVersion){
            sel.value = activeSnapshotVersion;
        }
    }catch(e){
        console.error("加载快照失败",e);
        sel.innerHTML = `<option value="">加载快照失败</option>`;
    }
}

async function rollbackSnapshot(){
    const sel = document.getElementById("snapshot-select");
    const ver = sel.value;
    if(!ver) return;
    if(!confirm(`确认回滚到版本${ver}？当前状态将被覆盖`)) return;
    try{
        await fetch(`${API_BASE}/snapshots/rollback?version=${ver}`, {method:"POST"});
        alert("回滚成功！");
        activeSnapshotVersion = ver;
        await refreshAllState();
    }catch(e){
        alert("回滚失败："+e);
    }
}

async function sendEvent(eventType, payload) {
    try {
        const resp = await fetch(`${API_BASE}/event`, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                event_type: eventType,
                source: "dashboard_ui",
                payload: payload
            })
        });
        const result = await resp.json();
        console.log("sendEvent返回：", result);
        alert(JSON.stringify(result, null, 2));
        // ✅ 写入事件日志
        appendEventLog({
            event_type:eventType,
            source:"dashboard_ui",
            payload:payload
        });
        activeSnapshotVersion = "";
        await refreshAllState();
    } catch (e) {
        console.error("sendEvent异常", e);
        alert("提交失败：" + e);
    }
}

window.onload = refreshAllState;

</script>
</body>
</html>
